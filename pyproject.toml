[project]
name = "grounded-ops"
version = "0.1.0"
description = "Evidence-first engineering knowledge and incident copilot."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.118.0,<1.0.0",
]

[dependency-groups]
dev = [
    "diff-cover>=10.5.1",
    "mypy>=1.18.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_ops"]
