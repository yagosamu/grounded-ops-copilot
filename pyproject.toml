[project]
name = "grounded-ops"
version = "0.1.0"
description = "Evidence-first engineering knowledge and incident copilot."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.118.0,<1.0.0",
]

[dependency-groups]
dev = [
    "diff-cover>=10.5.1",
    "httpx>=0.28.1",
    "mypy>=1.18.0,<2.0.0",
    "pytest>=8.4.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pyyaml>=6.0.3",
    "ruff>=0.12.0,<1.0.0",
]

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grounded_ops"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
markers = [
    "unit: isolated behavior tests",
    "integration: tests requiring local infrastructure",
    "api: HTTP interface tests",
    "retrieval_eval: offline retrieval evaluation tests",
    "answer_eval: offline grounded-answer evaluation tests",
    "agentic: bounded investigation tests",
    "security: adversarial security tests",
    "operational: load, recovery, and operational tests",
]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["grounded_ops"]

[tool.coverage.report]
fail_under = 80
show_missing = true
