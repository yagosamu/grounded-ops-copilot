services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_DB: ingestion_test
      POSTGRES_USER: ingestion_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?required}
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ingestion_test -d ingestion_test"]
      interval: 1s
      timeout: 2s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${TEST_MINIO_USER:?required}
      MINIO_ROOT_PASSWORD: ${TEST_MINIO_PASSWORD:?required}
    ports:
      - "127.0.0.1::9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 2s
      retries: 30
  opensearch:
    image: opensearchproject/opensearch:2.19.1
    environment:
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      discovery.type: single-node
    ports:
      - "127.0.0.1::9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health"]
      interval: 2s
      timeout: 3s
      retries: 60
